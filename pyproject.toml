[project]
name = "software_patents"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only"
]
requires-python = ">=3.11"
version = "0.1.0"
dependencies = [
    "beautifulsoup4",
    "coiled",
    "dask",
    "httpx2",
    "matplotlib",
    "nltk>=3.9.1",
    "openpyxl",
    "pandas",
    "pyarrow>=17.0.0",
    "pytask>=0.4.4",
    "pytask-latex",
    "pytask-parallel",
    "pytest",
    "pytest-cov",
    "s3fs>=2024.10.0",
    "scikit-learn",
    "universal-pathlib>=0.2.2",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[dependency-groups]
typing = [
    "ty>=0.0.107",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["src/software_patents/_version.py"]

[tool.pytask.ini_options]
paths = ["src/software_patents"]

[tool.ruff]
target-version = "py311"
fix = true
unsafe-fixes = true
extend-exclude = ["src/software_patents/exploration/*.ipynb"]

[tool.ruff.lint]
extend-ignore = [
    # Others.
    "ANN401",  # flake8-annotate typing.Any
    "PD",  # pandas-vet
    "COM812",  # Comply with ruff-format.
    "ISC001",  # Comply with ruff-format.
    # Temporary
    "D103",
    "D104",
    "TCH",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"*/test_*.py" = ["S101"]
"*/transformers.py" = ["ANN", "FBT", "D"]
"tests/*" = ["D", "ANN", "PLR2004"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.refurb]
python_version = "3.11"

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
testpaths = ["src"]
norecursedirs = [".idea", ".tox"]
filterwarnings = ["ignore:datetime.*:DeprecationWarning"]
markers = ["data: tests requiring the original or replicated datasets"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.ty.src]
include = ["src/software_patents"]
exclude = ["src/software_patents/exploration"]

[tool.ty.terminal]
error-on-warning = true
